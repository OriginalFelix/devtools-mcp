spring.application.name=devtools-server
spring.main.banner-mode=off

# Team-Server: lauscht auf allen Adressen; TLS übernimmt ein Reverse-Proxy
# (server.forward-headers-strategy=native, damit die Web-UI die öffentliche Adresse anzeigt).
server.port=8080

# Core-Datenbank (Benutzer, Tokens, Profile, Einstellungen, Projekte): Schema per Flyway. Verbindung siehe
# CoreDatabaseConfig (devtools.core.datasource.url/username/password, Standard H2-Datei core.mv.db im Server-Verzeichnis).
spring.flyway.locations=classpath:db/core
# "Using H2 2.4.x which is newer than the version Flyway has been verified with" bei jedem Start – H2 kommt aus der
# Boot-BOM, die Migrationen sind schlichtes SQL
logging.level.org.flywaydb.core.internal.database.base.Database=ERROR

# Graph-Storage der Code-Graphen (ArcadeDB): Standard eingebettet unter graphdb/ im Server-Verzeichnis. Extern mit
# devtools.graph.mode=remote und devtools.graph.host/port/database/user/password (siehe GraphStorage).
#devtools.graph.mode=embedded

logging.level.root=INFO

# Skills werden nur über die GraphQL-API gelesen/geschrieben – kein Lazy-Loading in der Web-UI nötig.
spring.jpa.open-in-view=false

# GraphQL-API für die Desktop-Apps: HTTP und WebSocket (Subscriptions) unter /graphql
spring.graphql.http.path=/graphql
spring.graphql.websocket.path=/graphql
# Ping an ruhende Subscriptions, sonst beenden Jetty bzw. ein Reverse-Proxy die Verbindung ("Connection Idle Timeout")
spring.graphql.websocket.keep-alive=15s
