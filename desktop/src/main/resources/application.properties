spring.application.name=devtools-mcp
spring.main.banner-mode=off

# Nur lokal erreichbar
server.address=127.0.0.1
# Graceful Shutdown wartet sonst bis zu 30 s auf offene MCP-Streams (SSE) verbundener Clients
spring.lifecycle.timeout-per-shutdown-phase=3s

# MCP-Server (Spring AI)
spring.ai.mcp.server.name=devtools-mcp
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.tool-change-notification=true
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.request-timeout=15m
# Zusätzliche Hinweise für das LLM (optional). Die eigentlichen Instructions baut ServerInstructions aus den
# Modulen; dieser Text wird dort als eigener Absatz nach dem allgemeinen Teil eingefügt.
spring.ai.mcp.server.instructions=

# Eingebettetes Backend (ohne eingetragenen Team-Server): GraphQL unter /graphql (HTTP und WebSocket), Schema der
# Core-Datenbank per Flyway, statt des Start-Administrators nur der lokale Benutzer (siehe LocalUser).
spring.graphql.http.path=/graphql
spring.graphql.websocket.path=/graphql
# Ping an ruhende Subscriptions, sonst beendet Jetty die Verbindung nach 30 s ("Connection Idle Timeout")
spring.graphql.websocket.keep-alive=15s
spring.flyway.locations=classpath:db/core
# "Using H2 2.4.x which is newer than the version Flyway has been verified with" bei jedem Start – H2 kommt aus der
# Boot-BOM, die Migrationen sind schlichtes SQL
logging.level.org.flywaydb.core.internal.database.base.Database=ERROR
spring.jpa.open-in-view=false
devtools.admin.create-initial=false

logging.level.root=INFO
logging.level.io.modelcontextprotocol=WARN
# Meldet "Stream unavailable" für jede Tool-Änderung an Sessions ohne offenen SSE-Kanal (z.B. reine POST-Clients) –
# harmlos, würde das Log aber bei jedem Umschalten in der UI fluten.
logging.level.org.springframework.ai.mcp.server.webmvc.transport.WebMvcStreamableServerTransportProvider=OFF
